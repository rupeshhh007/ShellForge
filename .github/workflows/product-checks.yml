name: Product checks
on:
  pull_request:
    paths: ['apps/**', 'services/**', 'src/safety_validator.py', 'tests/**', '.github/workflows/product-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  api-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core poppler-utils
      - run: python -m pip install -r requirements.txt -r services/api/requirements-dev.txt nbformat pypdf ipython
      - run: python -c 'from src.experiment_data import restore_splits; restore_splits()'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts services
      - run: python -m ruff check --select E9,F63,F7,F82 src tests scripts services
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verify production product flows
        run: |
          python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8010 --no-proxy-headers > /tmp/shellforge-api.log 2>&1 &
          npm --prefix apps/web run start -- --port 3010 > /tmp/shellforge-web.log 2>&1 &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3010/api/health; then break; fi
            sleep 1
          done
          cd apps/web
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3010 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-browser-evidence
          path: |
            docs/visual-qa/screenshots/*.png
            apps/web/playwright-report
            apps/web/test-results
            /tmp/shellforge-api.log
            /tmp/shellforge-web.log
